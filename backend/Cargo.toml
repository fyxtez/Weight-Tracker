[package]
name = "weight-tracker-backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/auth", "crates/http-middleware"]
resolver = "3"

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
secrecy = "0.10"
weight-tracker-auth = { path = "crates/auth" }
weight-tracker-http-middleware = { path = "crates/http-middleware" }
